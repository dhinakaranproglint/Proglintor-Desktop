<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Orbit</title>
  <link rel="stylesheet" href="../../shared/renderer/styles.css">
  <link rel="stylesheet" href="../../shared/renderer/orbit.css">
</head>
<body class="orbit-companion">
  <div class="oc-stage" id="stage">
    <div class="oc-bubble hit" id="bubble" role="status" aria-live="polite" hidden>
      <div class="oc-buddy" id="buddy" aria-hidden="true"></div>
      <div class="oc-body">
        <div class="oc-text" id="text"></div>
        <div class="oc-btns" id="btns"></div>
        <form class="oc-ask" id="askForm" autocomplete="off" hidden>
          <input id="askInput" maxlength="1000" placeholder="How can I help you today?" aria-label="Ask Orbit">
          <button class="btn sm primary" type="submit" aria-label="Send">Ask</button>
        </form>
      </div>
    </div>
    <div class="oc-orb hit" id="figure" data-state="idle" title="Click to talk. Drag to move. Right-click for options." aria-label="Orbit companion">
      <canvas id="orb"></canvas>
      <div class="oc-avatar" id="avatar" aria-hidden="true"></div>
    </div>
  </div>
  <script src="../../shared/renderer/common.js"></script>
  <script src="../../shared/renderer/orbit-logic.js"></script>
  <script src="../../shared/renderer/care-logic.js"></script>
  <script src="../../shared/renderer/orbit-buddies.js"></script>
  <script src="../../shared/renderer/orbit-orb.js"></script>
  <script src="../../shared/renderer/orbit-sound.js"></script>
  <script src="orbit-companion.js"></script>
</body>
</html>
